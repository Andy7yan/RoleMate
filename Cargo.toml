[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/native-host",
  "crates/desktop-core",
  "crates/native-messaging",
  "crates/secure-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
keyring = { version = "3.6", features = ["windows-native"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tauri = { version = "2.8", features = [] }
tauri-build = { version = "2.4", features = [] }
thiserror = "2"
uuid = { version = "1.17", features = ["v4", "serde"] }
